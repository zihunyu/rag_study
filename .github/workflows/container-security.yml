name: Container security and provenance

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  attestations: write
  security-events: write

jobs:
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f Dockerfile.backend -t ragkb-backend:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ragkb-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - run: docker save ragkb-backend:${{ github.sha }} -o ragkb-backend.tar
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ragkb-backend.tar
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign sign-blob --yes --bundle ragkb-backend.sigstore.json ragkb-backend.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-image-security
          path: |
            trivy-backend.sarif
            ragkb-backend.sigstore.json
          if-no-files-found: warn
