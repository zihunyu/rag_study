name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m venv /tmp/ragkb-smoke
      - run: /tmp/ragkb-smoke/bin/python -m pip install .
      - run: /tmp/ragkb-smoke/bin/python -c "import ragkb.runtime_components"
      - run: cp config/.env.example config/.env
      - run: /tmp/ragkb-smoke/bin/ragkb-backend --check

  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy backend/src/ragkb

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest --cov=ragkb --cov-branch --cov-report=xml --cov-fail-under=70
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: warn

  integration-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: >-
          python -m pytest
          backend/tests/test_mysql_retrieval.py
          backend/tests/test_zilliz_adapter.py
          backend/tests/test_zilliz_readiness.py

  rag-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: python scripts/check_rag_quality.py
      - run: python scripts/scan_secrets.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rag-quality
          path: artifacts/quality/rag-quality-report.json
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-failure
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f Dockerfile.backend -t ragkb-backend:${{ github.sha }} .
      - run: docker build -f Dockerfile.worker -t ragkb-worker:${{ github.sha }} .
      - run: docker build -f frontend/Dockerfile -t ragkb-frontend:${{ github.sha }} frontend
      - run: docker compose -f compose.yaml config --quiet

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.lock
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: >-
          python scripts/generate_assurance.py
          --output artifacts/implementation/assurance.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-assurance
          path: artifacts/implementation/assurance.json
          if-no-files-found: error
