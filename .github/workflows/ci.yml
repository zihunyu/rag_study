name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy backend/src/ragkb
      - run: python -m pytest --cov=ragkb --cov-branch --cov-report=xml --cov-fail-under=70
      - run: python scripts/check_rag_quality.py
      - run: python scripts/scan_secrets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-quality
          path: |
            coverage.xml
            artifacts/quality/rag-quality-report.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
