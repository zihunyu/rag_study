# 用户填写的非敏感项目配置。
# 必填但尚未确定的值保持为 "__FILL_ME__"。
input_version: 1
status: pending_user_input
last_updated_at: "2026-08-31"
notes: |
  用户尚未确定正式业务域，暂以“通用企业文档知识库”作为可逆的本地试点名称；负责人仍待填写。
  首版要求覆盖常见文档、HTML、表格和音频。
  数据包含个人信息或敏感内容，用户已明确允许发送到第三方 AI 服务。
  现有 LLM、Embedding、Reranker 均为第三方 Base URL + Token 形式，
  允许处理 public、internal 和 confidential 数据；restricted 数据仍禁止出站。
  MinerU 同时支持 mineru.net 托管 API 与自建 API，托管 API 已启用。
  跨境传输仍未放开；第三方服务必须先确认数据处理区域和合规条款。
  预算币种为 CNY，具体金额、模型 ID、服务地址和保留周期仍待填写。

project:
  display_name: "企业级 RAG 知识库"
  pilot_business_domain: "通用企业文档知识库"
  initial_tenant_code: "local"
  initial_knowledge_space: "general_knowledge"
  timezone: "Asia/Hong_Kong"
  owners:
    product_project_manager: "__FILL_ME__"
    technical_architect: "__FILL_ME__"
    security_compliance: "__FILL_ME__"
    sre_operations: "__FILL_ME__"
    qa_evaluation: "__FILL_ME__"
    business_uat: "__FILL_ME__"

scope:
  r1_required_formats:
    - pdf_text
    - pdf_scanned
    - image
    - docx
    - pptx
    - markdown
    - txt
    - html_upload
    - xls
    - xlsx
    - csv
    - wav
    - mp3
    - m4a
  legacy_doc_ppt_limited_support: true
  r11_required_formats: []
  excel_exact_calculation_required: false
  external_connectors_in_r1: []

deployment:
  mode: local_dev # local_dev | on_prem | private_cloud | public_cloud
  target_platform: native_processes
  docker_forbidden: true
  local_storage_only: true
  startup_commands:
    backend: "python run_backend.py"
    worker: "python run_worker.py"
    mineru: "python run_mineru.py"
    frontend: "npm run dev"
    config_check: "python scripts/check_config.py"
  air_gapped: false # 机器可联网并允许调用已批准的第三方 AI 服务
  production_region: local_machine
  allowed_data_regions:
    - local_machine
  gpu_available: true # true | false
  gpu_model_and_count: "NVIDIA GeForce RTX 4070 12GB x1"

capacity:
  initial_document_count: 3000
  initial_chunk_count: 150000 # 规划估算；按每份约 50 个 Chunk，试导入后重算
  daily_new_or_updated_documents: 200
  annual_growth_percent: "__FILL_ME__"
  peak_search_qps: 20
  concurrent_ask_requests: 50
  max_file_size_mb: 200
  max_pages_per_document: 600
  average_pages_per_document: 10 # 规划估算；试导入后重算
  average_chunk_tokens: 500

infrastructure:
  mysql:
    provision_mode: python_dev_stub # native_local | existing_native | python_dev_stub
    version: "8.4"
    host: not_applicable
    port: 3306
    database: "rag_kb"
    username: rag_app
    password_env: MYSQL_PASSWORD
    tls_required: false
  milvus:
    provision_mode: python_embedded_or_stub # native_local | existing_native | python_embedded_or_stub
    version: "2.6.x"
    uri: "python-local-stub://data/storage/vector"
    token_env: MILVUS_TOKEN
    tls_required: false
    collection_prefix: "rag"
  local_storage:
    root_path: "./data/storage"
    original_path: "./data/storage/original"
    artifact_path: "./data/storage/artifacts"
    quarantine_path: "./data/storage/quarantine"
    temp_path: "./data/storage/temp"
    audit_path: "./data/storage/audit"
    backup_path: "./data/storage/backups"
    max_total_size_gb: 100 # E 盘当前剩余约 227 GiB，先限制项目数据最多 100 GB
    atomic_rename_required: true
    checksum_algorithm: sha256
    encryption_at_rest: true
  rabbitmq:
    provision_mode: python_local_adapter # native_local | existing_native | python_local_adapter | disabled
    url_env: RABBITMQ_URL
  redis:
    provision_mode: python_local_adapter # native_local | existing_native | python_local_adapter | disabled
    url_env: REDIS_URL
  oidc:
    provider: other # enterprise_idp | keycloak | other；本地为单用户测试身份
    issuer_url: "local-dev://single-user"
    audience: rag-local
    client_id: rag-local-ui
    client_secret_env: OIDC_CLIENT_SECRET
    tenant_claim: tenant_id
    groups_claim: groups
    roles_claim: roles
    access_token_ttl_minutes: 480

ai_services:
  outbound_ai_allowed: true # true | false | by_classification
  allowed_data_classifications:
    - public
    - internal
    - confidential
  restricted_data_outbound_allowed: false
  outbound_requires_provider_region_approval: true
  mineru:
    mode: local # local | remote_api
    endpoint: "http://127.0.0.1:8000"
    token_env: MINERU_TOKEN
    version: "__FILL_ME__"
    office_route: "libreoffice_to_pdf"
    timeout_seconds: 300
    deployment_strategy: self_hosted_primary
    self_hosted_endpoint: "http://127.0.0.1:8000"
    hosted_api_endpoint: "https://mineru.net/api/v4"
    hosted_api_enabled: true
    hosted_api_requires_region_approval: true
    hosted_api_allowed_data_classifications:
      - public
      - internal
      - confidential
  llm:
    provider: openai_compatible_third_party
    endpoint: "__FILL_ME__"
    model_id: "__FILL_ME__"
    model_revision: "__FILL_ME__"
    api_key_env: LLM_API_KEY
    allowed_data_classifications:
      - public
      - internal
      - confidential
    timeout_seconds: "__FILL_ME__"
    max_concurrency: "__FILL_ME__"
  embedding:
    provider: openai_compatible_third_party
    endpoint: "__FILL_ME__"
    model_id: "__FILL_ME__"
    model_revision: "__FILL_ME__"
    api_key_env: EMBEDDING_API_KEY
    dimension: "__FILL_ME__"
    normalize: "__FILL_ME__"
    metric: COSINE
    max_concurrency: "__FILL_ME__"
    allowed_data_classifications:
      - public
      - internal
      - confidential
  reranker:
    provider: openai_compatible_third_party
    endpoint: "__FILL_ME__"
    model_id: "__FILL_ME__"
    model_revision: "__FILL_ME__"
    api_key_env: RERANKER_API_KEY
    max_concurrency: "__FILL_ME__"
    allowed_data_classifications:
      - public
      - internal
      - confidential
  ocr:
    provider: mineru # mineru | other
    endpoint: "http://127.0.0.1:8000"
    api_key_env: OCR_API_KEY
  asr:
    provider: "__FILL_ME__"
    endpoint: "__FILL_ME__"
    model_id: "__FILL_ME__"
    api_key_env: ASR_API_KEY

security_compliance:
  data_classification_levels:
    - public
    - internal
    - confidential
    - restricted
  highest_classification_in_scope: confidential
  pii_dlp_required: true
  cross_border_transfer_allowed: false
  approved_ai_processing_regions: []
  legal_hold_required: "__FILL_ME__"
  malware_scanner: windows_defender
  secrets_manager: local_env_file # vault | kms | platform_secret | other
  audit_worm_target: "__FILL_ME__"
  online_content_retention_days: "__FILL_ME__"
  backup_retention_days: "__FILL_ME__"
  audit_retention_days: "__FILL_ME__"
  tenant_offboarding_purge_days: "__FILL_ME__"

slo_and_finops:
  search_p95_ms: 1500
  verified_answer_ready_p95_ms: 12000
  search_monthly_availability_percent: 99.9
  ask_monthly_availability_percent: 99.5
  permission_revocation_seconds: 60
  online_cleanup_hours: 24
  control_and_content_rpo_minutes: 15
  core_search_rto_hours: 4
  max_cost_per_ask: "__FILL_ME__"
  max_cost_per_1000_pages_ingested: "__FILL_ME__"
  monthly_budget: "__FILL_ME__"
  budget_currency: CNY

evaluation_business:
  pilot_user_count: 50
  top_user_tasks:
    - "上传常见格式文档并确认解析状态"
    - "根据知识库提问并查看原文引用"
    - "查询 HTML 和音频转写内容"
    - "更新或删除资料后确认旧内容不再出现"
  business_kpis:
    answer_adoption_rate_target: 0.7
    first_contact_resolution_target: 0.6
    average_time_saved_minutes_target: 5
  evaluation_dataset_owner: "__FILL_ME__"
  high_risk_answer_requires_human_review: true
  high_risk_domains:
    - personal_data
    - confidential_business_data
  release_dataset_size: 500

adr_approvals:
  fastapi_modular_monolith: approve # approve | reject | revise
  mysql_control_plane_source_of_truth: approve
  local_filesystem_content_source_of_truth: approve
  immutable_document_versions: approve
  index_generation_high_watermark: approve
  transactional_outbox_inbox: approve
  canonical_document_parser_contract: approve
  milvus_native_bm25_first: approve
  application_layer_rrf: approve
  compiled_acl_security_watermark: approve
  search_ask_separation: approve
