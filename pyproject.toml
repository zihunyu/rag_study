[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-kb"
version = "0.0.0"
description = "Enterprise RAG knowledge base (G0 preparation baseline)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "jsonschema>=4.23,<5",
  "openpyxl>=3.1,<4",
  "Pillow>=11,<13",
  "pydantic>=2.11,<3",
  "pymilvus>=2.6,<3",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0,<2",
  "PyYAML>=6.0,<7",
  "starlette>=0.46,<1",
  "uvicorn>=0.35,<1",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "types-jsonschema>=4.23,<5",
  "types-openpyxl>=3.1,<4",
  "types-PyYAML>=6.0,<7",
  "types-xlrd>=2.0,<3",
]

[project.scripts]
ragkb-spike = "ragkb.spikes.cli:main"
ragkb-backend = "ragkb.runtime:run_backend"
ragkb-worker = "ragkb.runtime:run_worker"
ragkb-mineru = "ragkb.mineru_runtime:run_mineru"

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
ragkb = ["contracts/schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ragkb"]

[[tool.mypy.overrides]]
module = ["pymilvus", "pymilvus.*"]
ignore_missing_imports = true
