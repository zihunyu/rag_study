services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: config/.env
    ports: ["8000:8000"]
    volumes: ["rag-data:/app/data/storage"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: config/.env
    volumes: ["rag-data:/app/data/storage"]

  frontend:
    build: frontend
    ports: ["5173:80"]

volumes:
  rag-data:
