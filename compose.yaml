services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: config/.env
    ports: ["8000:8000"]
    volumes: ["rag-data:/app/data/storage"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: config/.env
    volumes: ["rag-data:/app/data/storage"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]

  frontend:
    build: frontend
    ports: ["5173:8080"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]

volumes:
  rag-data:
