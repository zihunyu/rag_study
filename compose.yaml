services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: config/.env
    ports: ["8000:8000"]
    volumes: ["rag-data:/app/data/storage"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: config/.env
    volumes: ["rag-data:/app/data/storage"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]

  frontend:
    build: frontend
    environment:
      FRONTEND_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://127.0.0.1:8000/api/v1}
      FRONTEND_PUBLIC_ORIGIN: ${FRONTEND_PUBLIC_ORIGIN:-http://127.0.0.1:5173}
      FRONTEND_OIDC_ENABLED: ${FRONTEND_OIDC_ENABLED:-false}
      FRONTEND_OIDC_AUTHORITY: ${FRONTEND_OIDC_AUTHORITY:-}
      FRONTEND_OIDC_CLIENT_ID: ${FRONTEND_OIDC_CLIENT_ID:-}
      FRONTEND_OIDC_SCOPE: ${FRONTEND_OIDC_SCOPE:-openid profile email}
    ports: ["5173:8080"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]

volumes:
  rag-data:
